<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Awesome Backend Projects</title>
  <desc id="description">25 backend projects plus a monitoring bonus. Five languages and hands-on backend learning.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#background)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <path d="M0 375H1200" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="77" fill="#5eead4" font-size="14" font-weight="700" letter-spacing="3">BUILD · EXPLORE · UNDERSTAND</text>
    <text x="60" y="148" fill="#f8fafc" font-size="56" font-weight="700">Awesome Backend</text>
    <text x="60" y="212" fill="#f8fafc" font-size="56" font-weight="700">Projects</text>
    <text x="64" y="257" fill="#cbd5e1" font-size="20">Small services. Real concepts. Hands-on learning.</text>
    <g font-size="15" font-weight="600" fill="#e2e8f0">
      <rect x="64" y="292" width="161" height="40" rx="20" fill="#1e293b" stroke="#475569"/>
      <text x="144" y="318" text-anchor="middle">25 + 1 projects</text>
      <rect x="239" y="292" width="147" height="40" rx="20" fill="#1e293b" stroke="#475569"/>
      <text x="312" y="318" text-anchor="middle">5 languages</text>
      <rect x="400" y="292" width="151" height="40" rx="20" fill="#1e293b" stroke="#475569"/>
      <text x="475" y="318" text-anchor="middle">Hands-on</text>
    </g>
  </g>
  <g transform="translate(858 80)">
    <rect width="264" height="240" rx="18" fill="#0f172a" stroke="#475569"/>
    <path d="M0 44H264" stroke="#475569"/>
    <circle cx="22" cy="22" r="5" fill="#fb7185"/>
    <circle cx="40" cy="22" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="22" r="5" fill="#5eead4"/>
    <g font-family="Consolas, monospace" font-size="15">
      <text x="24" y="80" fill="#94a3b8">$ backend.learn</text>
      <text x="24" y="116" fill="#38bdf8">{</text>
      <text x="40" y="148" fill="#e2e8f0">"build": "small",</text>
      <text x="40" y="180" fill="#e2e8f0">"learn": "deep"</text>
      <text x="24" y="212" fill="#5eead4">}</text>
    </g>
  </g>
</svg>